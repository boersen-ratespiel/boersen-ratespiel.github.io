name: Update news

# Holt regelmäßig die aktuellen Wirtschaftsmeldungen (RSS von Destatis und EZB), schreibt news.json
# und committet sie nur, wenn sich etwas geändert hat. Die Seite selbst bleibt rein statisch.
on:
  schedule:
    - cron: '17 * * * *' # stündlich, bewusst nicht zur vollen Stunde (dort ist GitHub Actions überlastet)
  workflow_dispatch: # manuell auslösbar: Actions-Tab -> "Update news" -> "Run workflow"

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch news
        run: python3 scripts/update_news.py

      - name: Commit news.json if changed
        run: |
          if git diff --quiet -- news.json && [ -z "$(git ls-files --others --exclude-standard -- news.json)" ]; then
            echo "news.json unverändert."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update news.json"
          git push
