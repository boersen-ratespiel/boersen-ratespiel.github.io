name: Update news

# Holt regelmäßig die aktuellen Wirtschaftsmeldungen (RSS von Destatis und EZB) und die Termine der nächsten Tage
# (Destatis, BEA, EZB, Fed), schreibt news.json/termine.json und committet nur, wenn sich etwas geändert hat.
# Die Seite selbst bleibt rein statisch.
on:
  schedule:
    - cron: '17 * * * *' # stündlich, bewusst nicht zur vollen Stunde (dort ist GitHub Actions überlastet)
  workflow_dispatch: # manuell auslösbar: Actions-Tab -> "Update news" -> "Run workflow"

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch news
        run: python3 scripts/update_news.py

      - name: Fetch calendar
        continue-on-error: true # fallen die Termine aus, sollen die News trotzdem aktualisiert werden
        run: python3 scripts/update_termine.py

      - name: Commit news.json and termine.json if changed
        run: |
          if git diff --quiet -- news.json termine.json && [ -z "$(git ls-files --others --exclude-standard -- news.json termine.json)" ]; then
            echo "news.json und termine.json unverändert."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json termine.json
          git commit -m "Update news"
          git push
