name: Deploy Pages

# Veröffentlicht die Seite auf GitHub Pages. Nötig, weil der klassische Pages-Build ("Deploy from a branch") nur bei
# Pushes von Personen läuft: Die stündlichen News-Commits (GITHUB_TOKEN) und Merges über GitHub-Apps lösen dort keinen
# Neubau aus. Voraussetzung: Settings -> Pages -> Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_call: # aus update-news.yml (neue News) und tiktok-post.yml (vor dem Posten)
  workflow_dispatch: # manuell: Actions-Tab -> "Deploy Pages" -> "Run workflow"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # beim Aufruf aus update-news.yml den gerade gepushten News-Commit holen, nicht den Stand vom Start

      - uses: actions/configure-pages@v5

      - name: Build Lexikon-Seiten und Sitemap
        run: python3 scripts/build_lexikon.py

      # Bilder für den TikTok-Beitrag des Tages (scripts/build_tiktok.py, nutzt das auf dem Runner vorinstallierte
      # Chrome). TikTok holt sie per URL von der Seite ab, siehe tiktok-post.yml. Ein Fehler darf den Deploy nicht stoppen.
      - name: TikTok-Bilder des Tages
        continue-on-error: true
        run: python3 scripts/build_tiktok.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

      # Bing & Co. über neue/geänderte Seiten informieren (IndexNow, siehe scripts/indexnow.py). Nur bei Pushes und
      # manuellen Läufen, nicht bei den stündlichen News-Deploys (dort ist github.event_name "schedule") und nicht beim
      # Aufruf aus tiktok-post.yml (github.workflow ist bei workflow_call der Name des aufrufenden Workflows).
      # Ein Fehler hier darf die bereits erfolgte Veröffentlichung nicht als gescheitert markieren.
      - name: IndexNow-Meldung
        if: github.workflow == 'Deploy Pages' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        run: python3 scripts/indexnow.py
